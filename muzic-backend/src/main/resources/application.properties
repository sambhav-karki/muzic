spring.application.name=muzic

# 1. Dynamic Port Binding (Uses Render's $PORT; falls back to 8080 locally)
server.port=${PORT:8080}

# 2. External API Keys
youtube.api.key=${YOUTUBE_API_KEY:}
gemini.api.key=${GEMINI_API_KEY}

# 3. PostgreSQL DataSource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/muzic}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. Hibernate & JPA Settings (Bypasses boot-time metadata freeze)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.open-in-view=false

# 5. Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/youtube

# 6. Frontend Client Origin
frontend.url=${FRONTEND_URL:http://localhost:4200}